# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
- deploy
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
include:
- template: Security/Secret-Detection.gitlab-ci.yml

# GitLab Pages: the old address now redirects to https://hexiel.tech (the site
# itself lives in gitlab.com/jkagidesigns1/hexiel-website).
pages:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public && cp pages-redirect/* public/
  artifacts:
    paths:
      - public

# PyPI release on version tags (vX.Y.Z) via Trusted Publishing — no stored secret.
# PyPI side: publisher for project "hexiel", namespace jkagidesigns1/public/applications,
# project hexiel, pipeline .gitlab-ci.yml, environment "pypi".
pypi-build:
  stage: deploy
  image: python:3.12-bookworm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - python -m pip install -q build twine
    - python -m build
    - python -m twine check --strict dist/*
    - test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/

pypi-publish:
  stage: deploy
  image: python:3.12-bookworm
  needs: [pypi-build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  environment: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - python -m pip install -q -U twine
    - python -m twine upload dist/*
