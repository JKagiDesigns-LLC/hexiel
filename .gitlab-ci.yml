# Secret scanning, bandit and the test suite also run in the git pre-commit hook (.githooks/pre-commit,
# installed with scripts/install-hooks.sh). The pipeline runs the suite again on every push, smoke-tests the
# one-line installers on clean machines, and publishes.
stages:
- test
- smoke
- deploy

# The whole suite on every push and merge request (the same command the pre-commit hook runs).
tests:
  stage: test
  image: python:3.12-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    HEXIEL_NO_REPORTS: "1"
  script:
    - python -m pip install -q -e '.[serve,dev]'
    - python -m pytest -q -p no:cacheprovider --deselect tests/test_escalate.py::test_repeated_failures_get_advice_and_then_the_cloud_model_takes_over

# install.sh on a clean Linux box with no Python: the tree under test is installed (HEXIEL_SPEC=.), as a
# non-root user, and the result must answer --version and --doctor --json (the doctor exits 1 there — no
# model is reachable in CI — but it must print a report with zero crashes).
smoke-linux:
  stage: smoke
  image: ubuntu:24.04
  needs: [tests]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates git > /dev/null
    - useradd -m tester && chown -R tester "$CI_PROJECT_DIR"
    - su tester -c "cd '$CI_PROJECT_DIR' && HEXIEL_NO_SETUP=1 HEXIEL_SPEC='.[serve]' sh install/install.sh"
    - su - tester -c "hexiel --version"
    - su - tester -c "hexiel --doctor --json > doctor.json || true; python3 -c 'import json;d=json.load(open(\"doctor.json\"));print(d[\"summary\"]);assert d[\"checks\"]' 2>/dev/null || ~/.local/bin/uv run --no-project python -c 'import json;d=json.load(open(\"doctor.json\"));print(d[\"summary\"]);assert d[\"checks\"]'"
    - su - tester -c "HEXIEL_NO_SETUP=1 hexiel -p 'say hi' || true"      # no model in CI: must fail with a sentence, not a traceback

# install.ps1 on a GitLab SaaS Windows runner (shared runners; the tag selects the Windows pool).
smoke-windows:
  stage: smoke
  needs: [tests]
  tags: [saas-windows-medium-amd64]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
  script:
    - $env:HEXIEL_NO_SETUP = "1"; $env:HEXIEL_SPEC = ".[serve]"; $env:HEXIEL_ALLOW_ADMIN = "1"
    - powershell -ExecutionPolicy Bypass -File install\install.ps1
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"; hexiel --version
    - hexiel --doctor --json | Out-File doctor.json; if (-not (Test-Path doctor.json)) { exit 1 }

# install.sh on a GitLab SaaS macOS runner (needs the macOS runner entitlement on the namespace; allowed to
# fail on branches so a missing entitlement never blocks a merge).
smoke-macos:
  stage: smoke
  needs: [tests]
  image: macos-14-xcode-15
  tags: [saas-macos-medium-m1]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
  script:
    - HEXIEL_NO_SETUP=1 HEXIEL_SPEC='.[serve]' sh install/install.sh
    - export PATH="$HOME/.local/bin:$PATH"; hexiel --version
    - hexiel --doctor --json > doctor.json || true; test -s doctor.json

# GitLab Pages: the old address now redirects to https://hexiel.tech (the site
# itself lives in gitlab.com/jkagidesigns1/hexiel-website).
pages:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public && cp pages-redirect/* public/
  artifacts:
    paths:
      - public

# PyPI release on version tags (vX.Y.Z) via Trusted Publishing — no stored secret.
# PyPI side: publisher for project "hexiel", namespace jkagidesigns1/public/applications,
# project hexiel, pipeline .gitlab-ci.yml, environment "pypi".
pypi-build:
  stage: deploy
  image: python:3.12-bookworm
  needs: [tests, smoke-linux]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - python -m pip install -q build twine
    - python -m build
    - python -m twine check --strict dist/*
    - test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/

pypi-publish:
  stage: deploy
  image: python:3.12-bookworm
  needs: [pypi-build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  environment: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - python -m pip install -q -U twine
    - python -m twine upload dist/*

# Mirror to GitHub: every push to the default branch (and every release tag) is pushed on to
# github.com/JKagiDesigns-LLC/hexiel. Non-forced, so a diverged GitHub repo fails loudly instead of being
# overwritten. GITHUB_MIRROR_TOKEN is a masked + protected CI/CD variable (Settings > CI/CD > Variables).
github-mirror:
  stage: deploy
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"            # full history, so the push is a fast-forward and not a shallow-clone rejection
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - apk add --no-cache git > /dev/null
    - git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/JKagiDesigns-LLC/hexiel.git"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
      else
        git push github "${CI_COMMIT_SHA}:refs/heads/${CI_DEFAULT_BRANCH}"
      fi
