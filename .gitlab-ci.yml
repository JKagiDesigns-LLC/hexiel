# Secret scanning, bandit and the test suite run in the git pre-commit hook (.githooks/pre-commit,
# installed with scripts/install-hooks.sh) rather than here; this pipeline only publishes.
stages:
- deploy

# GitLab Pages: the old address now redirects to https://hexiel.tech (the site
# itself lives in gitlab.com/jkagidesigns1/hexiel-website).
pages:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public && cp pages-redirect/* public/
  artifacts:
    paths:
      - public

# PyPI release on version tags (vX.Y.Z) via Trusted Publishing — no stored secret.
# PyPI side: publisher for project "hexiel", namespace jkagidesigns1/public/applications,
# project hexiel, pipeline .gitlab-ci.yml, environment "pypi".
pypi-build:
  stage: deploy
  image: python:3.12-bookworm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - python -m pip install -q build twine
    - python -m build
    - python -m twine check --strict dist/*
    - test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/

pypi-publish:
  stage: deploy
  image: python:3.12-bookworm
  needs: [pypi-build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  environment: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - python -m pip install -q -U twine
    - python -m twine upload dist/*

# Mirror to GitHub: every push to the default branch (and every release tag) is pushed on to
# github.com/JKagiDesigns-LLC/hexiel. Non-forced, so a diverged GitHub repo fails loudly instead of being
# overwritten. GITHUB_MIRROR_TOKEN is a masked + protected CI/CD variable (Settings > CI/CD > Variables).
github-mirror:
  stage: deploy
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"            # full history, so the push is a fast-forward and not a shallow-clone rejection
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - apk add --no-cache git > /dev/null
    - git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/JKagiDesigns-LLC/hexiel.git"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
      else
        git push github "${CI_COMMIT_SHA}:refs/heads/${CI_DEFAULT_BRANCH}"
      fi
