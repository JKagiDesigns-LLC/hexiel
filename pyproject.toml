[project]
name = "hexiel"
version = "0.3.14"
description = "Open-source AI coding agent for the terminal and browser — runs on local Ollama models (even on modest hardware) or any cloud LLM. A self-hostable alternative to Claude Code and opencode."
readme = "README.md"
license = "LicenseRef-GPL-3.0-with-Commons-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai", "coding-agent", "ai-coding-assistant", "llm", "ollama", "local-llm",
            "terminal", "tui", "cli", "claude-code-alternative", "opencode-alternative",
            "anthropic", "openai", "qwen", "agent", "developer-tools", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "textual>=0.86",
    "httpx>=0.27",
    "duckdb>=1.1",      # data tool: SQL over CSV/Excel/Parquet
    "openpyxl>=3.1",    # Excel read/write (pure Python)
    "pypdf>=4.0",       # PDF text for document Q&A (pure Python)
]

[project.urls]
Homepage = "https://hexiel.tech"
Designer = "https://www.jkagidesigns.com"
Source = "https://gitlab.com/jkagidesigns1/public/applications/hexiel"
Issues = "https://gitlab.com/jkagidesigns1/public/applications/hexiel/-/issues"

[project.scripts]
hexiel = "hexiel.main:main"

[project.optional-dependencies]
serve = ["aiohttp>=3.9"]
dev = ["pytest", "bandit", "detect-secrets"]

[tool.setuptools.packages.find]
include = ["hexiel*"]

[tool.setuptools.package-data]
hexiel = ["web/*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
