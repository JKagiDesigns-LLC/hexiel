[project]
name = "hexiel"
version = "0.9.14"
description = "Open-source AI coding agent for the terminal and browser — runs on local Ollama models (even on modest hardware) or any cloud LLM. A self-hostable alternative to Claude Code and opencode."
readme = "README.md"
license = "LicenseRef-GPL-3.0-with-Commons-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai", "coding-agent", "ai-coding-assistant", "llm", "ollama", "local-llm",
            "terminal", "tui", "cli", "claude-code-alternative", "opencode-alternative",
            "anthropic", "openai", "qwen", "agent", "developer-tools", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "textual>=0.86",
    "httpx>=0.27",
    "duckdb>=1.1",      # data tool: SQL over CSV/Excel/Parquet
    "openpyxl>=3.1",    # Excel read/write (pure Python)
    "pypdf>=4.0",       # PDF text for document Q&A (pure Python)
    "Pillow>=10.0",     # image tool: edit, create, combine, diff, convert (wheels for every OS)
    "segno>=1.6",       # QR codes (pure Python)
    "markdown>=3.5",    # the render tool: Markdown pages to HTML (pure Python)
    "pillow-heif>=0.18",        # iPhone HEIC photos
    "imageio-ffmpeg>=0.5",      # a bundled ffmpeg binary (every OS, no admin rights) for the video/audio tool
]

[project.urls]
Homepage = "https://hexiel.tech"
Designer = "https://www.jkagidesigns.com"
Source = "https://gitlab.com/jkagidesigns1/public/applications/hexiel"
Issues = "https://hexiel.tech/support/"

[project.scripts]
hexiel = "hexiel.main:main"

[project.optional-dependencies]
serve = ["aiohttp>=3.9"]
code = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]   # exact symbol ranges for non-Python files (symbols.py)
view = ["textual-image>=0.8"]   # inline image thumbnails in the terminal (Kitty, Sixel, or block fallback)
images = []   # kept so older install commands still work: these are core dependencies now
see = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy", "rapidocr-onnxruntime>=1.2"]   # local eyes: Florence-2 captions/objects + OCR with no system program (weights: hexiel --get-vision)
dev = ["pytest", "bandit", "detect-secrets", "ruff"]

[tool.setuptools.packages.find]
include = ["hexiel*"]

[tool.setuptools.package-data]
hexiel = ["web/*", "starter/*.json", "starter/skills/*.md"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
